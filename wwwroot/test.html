<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Prueba SignalR - RanchoMqttApi</title>
</head>
<body>
<h1>Prueba del Hub RelesHub</h1>

<h2>Login</h2>
<p>
  Email: <input id="inputEmail" value="admin@rancho.com">
  Password: <input id="inputPassword" type="password" value="admin123">
  <button id="btnLogin">Login</button>
</p>
<p>Sesión: <span id="estadoLogin">no autenticado</span></p>

<hr>

<p>Estado de conexion: <span id="estadoConexion">esperando login...</span></p>
<div id="bannerBroker" style="display:none; padding:8px; font-weight:bold;"></div>
<p>Última temperatura: <span id="ultimaTemperatura">-- °C</span> <small id="ultimaTemperaturaInfo"></small></p>
<div id="log" style="font-family: monospace;"></div>

<hr>

<h2>Prueba de comando (HTTP)</h2>
<p>
  Tipo: <input id="inputTipo" value="riego">
  Id: <input id="inputId" value="1" type="number">
  Estado:
  <select id="inputEstado">
    <option value="true">on</option>
    <option value="false">off</option>
  </select>
  <button id="btnEnviar">Enviar comando</button>
</p>
<p id="resultadoComando" style="font-family: monospace;"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script>
  let token = null;
  let connection = null;

  document.getElementById("btnLogin").addEventListener("click", async () => {
    const email = document.getElementById("inputEmail").value;
    const password = document.getElementById("inputPassword").value;
    const estadoLogin = document.getElementById("estadoLogin");

    estadoLogin.textContent = "autenticando...";

    try {
      const resp = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userMail: email, password: password })
      });

      if (!resp.ok) {
        estadoLogin.textContent = "login fallido (" + resp.status + ")";
        return;
      }

      const datos = await resp.json();
      token = datos.token;
      estadoLogin.textContent = "autenticado ✔";

      iniciarConexion(token);
    } catch (err) {
      estadoLogin.textContent = "error: " + err;
    }
  });

  function iniciarConexion(token) {
    connection = new signalR.HubConnectionBuilder()
      .withUrl("/hubs/reles", { accessTokenFactory: () => token })
      .withAutomaticReconnect()
      .build();

    registrarHandlers(connection);

    connection.start()
      .then(() => { document.getElementById("estadoConexion").textContent = "conectado"; })
      .catch(err => { document.getElementById("estadoConexion").textContent = "error: " + err; });
  }

  function registrarHandlers(connection) {
  connection.on("EstadoActualizado", (tipo, id, estado, exito) => {
    const linea = document.createElement("p");
    linea.textContent = new Date().toLocaleTimeString() + " -> tipo: " + tipo + ", id: " + id + ", estado: " + estado + ", exito: " + exito;
    document.getElementById("log").prepend(linea);
  });

  const banner = document.getElementById("bannerBroker");

  connection.on("BrokerDesconectado", (mensaje) => {
    banner.style.display = "block";
    banner.style.background = "#f8d7da";
    banner.style.color = "#842029";
    banner.textContent = "⚠ " + mensaje;
  });

  connection.on("BrokerConectado", (mensaje) => {
    banner.style.display = "block";
    banner.style.background = "#d1e7dd";
    banner.style.color = "#0f5132";
    banner.textContent = "✔ " + (mensaje ?? "Conectado al broker");
    setTimeout(() => { banner.style.display = "none"; }, 4000);
  });

  connection.on("TemperaturaActualizada", (tipo, id, temperatura, fecha) => {
    document.getElementById("ultimaTemperatura").textContent = temperatura + " °C";
    document.getElementById("ultimaTemperaturaInfo").textContent =
      "(sensor " + tipo + "/" + id + " - " + new Date(fecha).toLocaleTimeString() + ")";

    const linea = document.createElement("p");
    linea.textContent = new Date().toLocaleTimeString() + "tipo: " + tipo + ", id: " + id + ", temperatura: " + temperatura;
    document.getElementById("log").prepend(linea);
  });

  connection.on("ComandoExpirado", (tipo, id, mensaje) => {
    const linea = document.createElement("p");
    linea.style.color = "#b45309";
    linea.style.fontWeight = "bold";
    linea.textContent = new Date().toLocaleTimeString() + " ⏱ EXPIRADO -> tipo: " + tipo + ", id: " + id + " -> " + mensaje;
    document.getElementById("log").prepend(linea);
  });
  }

  document.getElementById("btnEnviar").addEventListener("click", async () => {
    const tipo = document.getElementById("inputTipo").value;
    const id = document.getElementById("inputId").value;
    const estado = document.getElementById("inputEstado").value;
    const resultado = document.getElementById("resultadoComando");

    resultado.textContent = "Enviando...";
    resultado.style.color = "black";

    try {
      const resp = await fetch(`/api/reles/${tipo}/${id}/cambiar?estado=${estado}`, {
        method: "PATCH",
        headers: token ? { "Authorization": "Bearer " + token } : {}
      });
      const datos = await resp.json();

      if (resp.ok) {
        resultado.style.color = "green";
        resultado.textContent = `OK (${resp.status}): ${datos.mensaje}`;
      } else {
        resultado.style.color = "red";
        resultado.textContent = `Error (${resp.status}): ${datos.mensaje}`;
      }
    } catch (err) {
      resultado.style.color = "red";
      resultado.textContent = "Error de red: " + err;
    }
  });
</script>
</body>
</html>
